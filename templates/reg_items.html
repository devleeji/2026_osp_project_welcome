{% extends "index.html" %}
{% block title %}상품 등록 - Ewha Market{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reg_items.css') }}">
<main class="regi">
  <a class="back-link" href="{{ request.referrer or '/' }}">← &nbsp;돌아가기</a>
  <div class="section-header">
    <h1>상품 등록</h1>
    <span class="campus-pill">Ewha Womans University</span>
  </div>
  <form action="/result" method="POST" enctype="multipart/form-data">
    <div class="registration-grid">
      <section>
        <div class="section-header">
          <h2>상품 상세</h2>
          <span class="reg-small"><span class="reg-green">*</span> 필수 입력 항목</span>
        </div>
        <div class="form-group">
          <label for="seller_id">판매자 ID<span class="reg-green">*</span></label>
          <input type="text" id="seller_id" name="seller_id" value="{{ session['id'] }}" readonly>
          <small>상품 판매글에 판매자 ID가 공개됩니다.</small>
        </div>
        <div class="field-2-1-row">
          <div class="form-group">
            <label for="product_name">상품명 <span class="reg-green">*</span></label>
            <input type="text" id="product_name" name="product_name" placeholder="e.g. 떡볶이" required>
          </div>
          <div class="form-group">
            <label for="category">카테고리 <span class="reg-green">*</span></label>
            <select id="category" name="category" required>
              <option value="" disabled selected>카테고리를 선택해 주세요</option>
            <option value="분식">분식</option>
            <option value="튀김">튀김</option>
            <option value="탄산음료">탄산음료</option>
            <option value="꼬치">꼬치</option>
            <option value="밀크티">밀크티</option>
            <option value="기타">기타</option>
          </select>
          </div>
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="price">가격 <span class="reg-green">*</span></label>
            <div><input type="number" id="price" name="price" min="0" placeholder="가격 입력" required></div>
          </div>
          <div class="form-group">
            <label for="address">장소 <span class="reg-green">*</span></label>    
            <select id="address" name="address" required>
              <option value="" disabled selected>장소를 선택해주세요</option>
              <option value="학생문화관">학생문화관</option>
              <option value="생활관">생활관</option>
              <option value="정문">정문</option>
              <option value="포스코관">포스코관</option>
              <option value="대강당">대강당</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="status">상품 상태 <span class="reg-green">*</span></label>
          <select id="status" name="status" required>
            <option value="" disabled selected>상품 상태를 선택해 주세요</option>
            <option value="지정일 예약">지정일 예약</option>
            <option value="당일 수령 가능">당일 수령 가능</option>
          </select>
        </div>
        <div class="form-group">
          <label for="email">이메일 <span class="reg-green">*</span></label>
          <input type="email" id="email" name="email" placeholder="example@ewha.ac.kr" required>
        </div>
        <div class="form-group">
          <label for="description">상세 설명 <span class="reg-green">*</span></label>
          <textarea id="description" name="description" maxlength="1000" placeholder="음식/굿즈의 상세 구성, 준비된 수량, 운영 시간 등 부스에 방문하기 전 꼭 알아야 할 정보를 소개해 주세요." required></textarea>
          <div><span id="description-length">0</span> / 1,000</div>
        </div>
      </section>
      <aside class="photo-section">
        <div class="section-header">
          <h2>사진 <span class="reg-green">*</span></h2>
          <span class="reg-small" id="photo-count">0 / 1</span>
        </div>
        <div id="upload-zone" class="photo-box">
          <div class="photo-inner">
            <strong class="photo-text">여기에 사진을 드래그하여 올려주세요</strong>
            <div class="reg-small">또는 컴퓨터에서 파일 선택</div>
            <label class="photo-select" for="picture">사진 선택하기</label>
            <input class="file-input" type="file" id="picture" name="picture" accept="image/jpeg,image/png" required>
          </div>
        </div>
        <div id="photo-preview" class="photo-preview"><span>사진을 선택하면 여기에 표시됩니다.</span></div>
        <p class="reg-small">JPG 또는 PNG (파일당 최대 10MB)</p>
      </aside>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" type="reset">취소</button>
      <button class="btn btn-primary" type="submit">상품 등록 &nbsp;→</button>
    </div>
  </form>
</main>
<script>
(function () {
  const description = document.getElementById('description');
  const length = document.getElementById('description-length');
  const input = document.getElementById('picture');
  const count = document.getElementById('photo-count');
  const preview = document.getElementById('photo-preview');
  const zone = document.getElementById('upload-zone');
  const form = document.querySelector('.regi form');
  const placeholder = '사진을 선택하면 여기에 표시됩니다.';
  let previewUrl = null;

  description.addEventListener('input', () => {
    length.textContent = description.value.length;
  });

  function clearPreview() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = null;
    preview.replaceChildren();
    const span = document.createElement('span');
    span.textContent = placeholder;
    preview.appendChild(span);
    count.textContent = '0 / 1';
  }

  function updatePreview() {
    const file = input.files[0];
    if (!file) {
      clearPreview();
      return;
    }
    if (!['image/jpeg', 'image/png'].includes(file.type) || file.size > 10 * 1024 * 1024) {
      alert('10MB 이하의 JPG 또는 PNG 파일을 선택해 주세요.');
      input.value = '';
      clearPreview();
      return;
    }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(file);
    const image = document.createElement('img');
    image.alt = '선택한 상품 사진';
    image.src = previewUrl;
    preview.replaceChildren(image);
    count.textContent = '1 / 1';
  }

  input.addEventListener('change', updatePreview);
  zone.addEventListener('dragover', event => event.preventDefault());
  zone.addEventListener('drop', event => {
    event.preventDefault();
    const files = event.dataTransfer.files;
    if (files.length !== 1) {
      alert('사진은 1장만 선택할 수 있습니다.');
      return;
    }
    const transfer = new DataTransfer();
    transfer.items.add(files[0]);
    input.files = transfer.files;
    updatePreview();
  });
  form.addEventListener('reset', () => {
    setTimeout(() => {
      length.textContent = '0';
      clearPreview();
    }, 0);
  });
})();
</script>
{% endblock %}
